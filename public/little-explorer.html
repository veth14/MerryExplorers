<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #f8fbff; --fg: #002f76; --muted: #4f6280; --panel: #ffffff; --line: #d7e2f3;
    --accent: #0066cc; --on-accent: #ffffff; --stage: #b9e5ff; --floor: #b7e4c7;
    --f-display: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
    --f-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c2234; --fg: #f6ead8; --muted: #b7a994; --panel: #252d44; --line: #3a4562;
      --accent: #ffb067; --on-accent: #2a1606; --stage: #b9e5ff; --floor: #3d6e5a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c2234; --fg: #f6ead8; --muted: #b7a994; --panel: #252d44; --line: #3a4562;
    --accent: #ffb067; --on-accent: #2a1606; --stage: #b9e5ff; --floor: #3d6e5a; color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body);
    padding: 0;
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  .app { position: relative; width: 100%; height: 100%; min-height: 0; max-width: 1100px; margin-inline: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .app:fullscreen, .app:-webkit-full-screen { width: 100vw; height: 100dvh; max-width: none; margin: 0; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); border-radius: 0; background: var(--bg); }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  .app:fullscreen .top, .app:-webkit-full-screen .top { display: none; }
  h1 { font: 600 1.7rem/1.1 var(--f-display); margin: 0; }
  .hint { margin: 0; color: var(--muted); font-size: 0.875rem; }
  .control-dock { position: absolute; z-index: 8; top: 0; left: 0; right: 0; height: 0; pointer-events: none; }
  .control-reveal { position: absolute; top: 0; left: 50%; width: 54px; height: 13px; padding: 0; border: 0; border-radius: 0 0 10px 10px; background: rgba(0,47,118,.76); color: #fff; font: 700 12px/10px var(--f-body); cursor: pointer; transform: translateX(-50%); pointer-events: auto; box-shadow: 0 3px 9px rgba(0,47,118,.18); }
  .control-dock:hover .control-reveal, .control-dock:focus-within .control-reveal, .control-dock.is-open .control-reveal { height: 20px; }
  .toolbar { position: absolute; top: 20px; left: 12px; right: 12px; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; border: 1px solid rgba(215,226,243,.9); border-radius: 18px; background: rgba(248,251,255,.96); box-shadow: 0 12px 32px rgba(0,47,118,.2); opacity: 1; visibility: visible; transform: none; transform-origin: top center; transition: opacity .18s ease, transform .18s ease, visibility .18s; pointer-events: auto; }
  .control-reveal { display: none; }
  .app:fullscreen .control-dock, .app:-webkit-full-screen .control-dock { height: 20px; pointer-events: auto; }
  .app:fullscreen .toolbar, .app:-webkit-full-screen .toolbar { opacity: 0; visibility: hidden; transform: translateY(-12px) scale(.985); pointer-events: none; }
  .app:fullscreen .control-dock:hover .toolbar, .app:fullscreen .control-dock:focus-within .toolbar, .app:fullscreen .control-dock.is-open .toolbar,
  .app:-webkit-full-screen .control-dock:hover .toolbar, .app:-webkit-full-screen .control-dock:focus-within .toolbar, .app:-webkit-full-screen .control-dock.is-open .toolbar { opacity: 1; visibility: visible; transform: translateY(0) scale(1); pointer-events: auto; }
  .app:fullscreen .control-reveal, .app:-webkit-full-screen .control-reveal { display: block; opacity: 0; }
  @media (hover: none) {
    .app:fullscreen .control-reveal, .app:-webkit-full-screen .control-reveal { opacity: 1; }
  }
  .fullscreen-learning-nav { position: absolute; z-index: 7; left: 50%; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); display: none; max-width: calc(100% - 20px); align-items: center; gap: 6px; overflow-x: auto; padding: 7px; border: 1px solid rgba(255,255,255,.9); border-radius: 20px; background: rgba(248,251,255,.94); box-shadow: 0 12px 30px rgba(0,47,118,.25), inset 0 1px 0 #fff; transform: translateX(-50%); backdrop-filter: blur(10px); }
  .app:fullscreen .fullscreen-learning-nav, .app:-webkit-full-screen .fullscreen-learning-nav { display: flex; }
  .fullscreen-learning-nav button { flex: 0 0 auto; min-height: 44px; padding: 8px 13px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: var(--fg); font: 700 .88rem/1.1 var(--f-body); white-space: nowrap; cursor: pointer; touch-action: manipulation; }
  .fullscreen-learning-nav button.is-selected { border-color: #ffcc00; background: #003399; color: #fff; box-shadow: 0 3px 0 #00245a; }
  .fullscreen-learning-nav button:active { transform: translateY(1px); }
  @media (max-width: 640px) {
    .fullscreen-learning-nav { bottom: calc(82px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 16px); gap: 4px; padding: 6px; }
    .fullscreen-learning-nav button { min-height: 48px; padding: 8px 10px; font-size: .82rem; }
  }
  .model-picker { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
  .model-label { padding: 0 7px; color: var(--muted); font-size: .78rem; font-weight: 700; }
  .model-option { font: inherit; font-size: .85rem; font-weight: 700; color: var(--fg); background: transparent; border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; }
  .model-option[aria-pressed="true"] { color: #fff; background: var(--accent); }
  .stage { position: relative; flex: 1; min-height: 0; background: var(--stage); border-radius: 22px; overflow: hidden; cursor: grab; }
  .stage:active { cursor: grabbing; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .zoom-controls { position: absolute; z-index: 4; top: 12px; right: 12px; display: flex; gap: 6px; }
  .zoom-controls button { min-width: 38px; min-height: 38px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.95); color: var(--fg); box-shadow: 0 2px 8px rgba(0,47,118,.12); font: 700 1.15rem/1 var(--f-body); cursor: pointer; touch-action: manipulation; }
  .zoom-controls button:hover { border-color: var(--accent); background: #fff; }
  .touch-pointer { position: absolute; z-index: 3; display: none; width: 30px; height: 30px; border: 3px solid #ffcc00; border-radius: 50%; background: rgba(255, 204, 0, .14); box-shadow: 0 0 0 3px rgba(255, 204, 0, .18), 0 2px 7px rgba(0, 47, 118, .18); transform: translate(-50%, -50%); pointer-events: none; animation: pointer-pulse 1.2s ease-in-out infinite; }
  .callout-line { position: absolute; z-index: 5; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .callout-line path { fill: none; stroke: #ffbf00; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 2px 2px rgba(0,47,118,.32)); }
  .callout-line circle { fill: #fff8d5; stroke: #ffbf00; stroke-width: 4; filter: drop-shadow(0 2px 3px rgba(0,47,118,.28)); }
  .part-popup { position: absolute; z-index: 6; top: 0; left: 0; display: flex; align-items: center; gap: 12px; width: min(330px, calc(100% - 28px)); padding: 14px 17px; border: 2px solid #ffcc00; border-radius: 22px; background: linear-gradient(145deg, #fff 10%, #fffaf0 100%); color: #002f76; box-shadow: 0 14px 0 #e6a900, 0 20px 32px rgba(0,47,118,.28), inset 0 2px 0 #fff; opacity: 0; visibility: hidden; transform: perspective(700px) rotateX(8deg) scale(.88); transform-origin: center; transition: opacity .2s ease, transform .24s cubic-bezier(.2,.85,.2,1), visibility .2s; pointer-events: none; }
  .part-popup.is-visible { opacity: 1; visibility: visible; transform: perspective(700px) rotateX(0) scale(1); }
  .part-popup-icon { display: grid; flex: 0 0 50px; width: 50px; height: 50px; place-items: center; border: 2px solid #ffe27a; border-radius: 17px; background: linear-gradient(145deg, #fff4bf, #ffdf67); box-shadow: inset 0 3px 5px rgba(255,255,255,.9), 0 4px 0 #e8b51e; font-size: 1.8rem; }
  .part-popup-copy { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
  .part-popup-name { font: 600 1.2rem/1.15 var(--f-display); }
  .part-popup-hint { color: #4f6280; font-size: .9rem; line-height: 1.35; }
  .part-popup-kicker { color: #a66d00; font-size: .68rem; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
  @keyframes pointer-pulse { 50% { scale: 1.12; } }
  .fallback { margin: 0; padding: 24px; color: var(--muted); }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  .tog { font: inherit; font-weight: 600; font-size: 0.9rem; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px; cursor: pointer; }
  .customize-toggle { font: inherit; font-weight: 700; color: var(--fg); background: #ffcc00; border: 1px solid #e6b800; border-radius: 999px; padding: 9px 16px; cursor: pointer; }
  .fullscreen-toggle { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-weight: 700; color: var(--fg); background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; box-shadow: 0 2px 8px rgba(0,47,118,.12); cursor: pointer; }
  .customize-panel { position: absolute; z-index: 10; top: 66px; right: 0; width: min(100%, 760px); padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: 0 14px 36px rgba(0,47,118,.2); }
  .tog[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .tog:hover { border-color: var(--accent); }
  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 10px; }
  .group { border: 0; margin: 0; padding: 0; min-width: 0; }
  .group legend { padding: 0; margin-bottom: 6px; font: 600 .95rem var(--f-display); color: var(--fg); }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw { width: 32px; height: 32px; padding: 0; border-radius: 50%; background: var(--c); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
  .sw:hover { box-shadow: 0 0 0 2px var(--muted); }
  .sw[aria-pressed="true"]:hover { box-shadow: 0 0 0 3px var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Little Explorer</h1>
    <p class="hint">Drag or pinch to explore. Tap a body part to learn it.</p>
  </header>
  <main id="stage" class="stage" aria-label="Interactive 3D child explorer. Tap a body part to learn its name.">
    <div class="control-dock" id="control-dock">
    <button class="control-reveal" id="control-reveal" type="button" aria-label="Show explorer controls" aria-expanded="false">⌄</button>
    <div class="toolbar" id="explorer-toolbar" aria-label="Explorer controls">
    <div class="model-picker" role="group" aria-label="Choose an explorer">
      <span class="model-label">Explorer</span>
      <button type="button" class="model-option" id="model-boy" aria-pressed="true">Boy</button>
      <button type="button" class="model-option" id="model-girl" aria-pressed="false">Girl</button>
    </div>
    <div class="toggles">
      <button type="button" class="tog" id="tog-wave" aria-pressed="false">Wave</button>
      <button type="button" class="tog" id="tog-face" aria-pressed="false">Close-up</button>
      <button type="button" class="tog" id="tog-spin" aria-pressed="false">Spin</button>
      <button type="button" class="tog" id="tog-pack" aria-pressed="true">Backpack</button>
    </div>
    <button type="button" class="customize-toggle" id="tog-customize" aria-expanded="false" aria-controls="customize-panel">🎨 Customize</button>
    <button type="button" class="fullscreen-toggle" id="fullscreen-toggle" aria-label="Enter fullscreen">⛶ Fullscreen</button>
    </div>
    </div>
    <section class="customize-panel" id="customize-panel" aria-label="Customize the explorer" hidden>
      <div class="groups" id="groups"></div>
    </section>
    <div class="zoom-controls" role="group" aria-label="Zoom controls">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" id="zoom-reset">Fit</button>
    </div>
    <nav class="fullscreen-learning-nav" id="fullscreen-learning-nav" aria-label="Body part lesson navigation">
      <button type="button" data-nav="previous" aria-label="Previous body part">←</button>
      <button type="button" data-part-id="head">Face</button>
      <button type="button" data-part-id="shoulders">Body</button>
      <button type="button" data-part-id="knees">Legs &amp; feet</button>
      <button type="button" data-nav="next" aria-label="Next body part">→</button>
    </nav>
    <div id="touch-pointer" class="touch-pointer" aria-hidden="true"></div>
    <svg class="callout-line" id="callout-line" aria-hidden="true" hidden><path id="callout-path"></path><circle id="callout-dot" r="7"></circle></svg>
    <div id="part-popup" class="part-popup" role="status" aria-live="polite" hidden>
      <span class="part-popup-copy"><span class="part-popup-kicker">You found</span><strong class="part-popup-name" id="part-popup-name"></strong><span class="part-popup-hint" id="part-popup-hint"></span></span>
      <span class="part-popup-icon" id="part-popup-icon" aria-hidden="true"></span>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fail(msg) { stage.innerHTML = '<p class="fallback">' + msg + '</p>'; }
  if (!window.THREE || !THREE.OrbitControls) { fail('The 3D library did not load. Check your connection and reload the page.'); return; }
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
  catch (e) { fail('This browser could not start WebGL, so the 3D figure cannot be shown.'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 1 : 1.5));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
  camera.position.set(2.6, 2.0, 7.6);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  var FULL = { target: new THREE.Vector3(0, 1.35, 0), dist: 8 };
  var FACE = { target: new THREE.Vector3(0, 2.12, 0.2), dist: 2.7 };
  controls.target.copy(FULL.target);
  controls.enableDamping = true; controls.dampingFactor = 0.07; controls.enablePan = false;
  controls.enableZoom = true;
  controls.minDistance = 1.8; controls.maxDistance = 14; controls.maxPolarAngle = Math.PI * 0.49;
  controls.autoRotateSpeed = 2.0;
  controls.update();

  function lerp(a, b, t) { return a + (b - a) * t; }
  function lin(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
  function std(hex, rough) { return new THREE.MeshStandardMaterial({ color: lin(hex), roughness: rough, metalness: 0 }); }
  function setCol(m, hex) { m.color.set(hex).convertSRGBToLinear(); }

  /* soft, even lighting: a sunny key, a warm bounce and a gentle sky fill */
  scene.add(new THREE.HemisphereLight(0xffffff, 0xffd9b0, 0.95));
  var key = new THREE.DirectionalLight(0xfff3e0, 0.85);
  key.position.set(3.5, 6, 5.5);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -3; key.shadow.camera.right = 3; key.shadow.camera.top = 4; key.shadow.camera.bottom = -2;
  key.shadow.camera.near = 1; key.shadow.camera.far = 20;
  key.shadow.bias = -0.0005; key.shadow.radius = 4;
  scene.add(key);

  var M = {
    skin: std('#f1c19b', 0.75), hair: std('#6a4126', 0.7),
    eye: std('#4b2e1e', 0.25), pupil: std('#120c0a', 0.2),
    hl: new THREE.MeshBasicMaterial({ color: 0xffffff }),
    blush: new THREE.MeshBasicMaterial({ color: lin('#ff7f7f'), transparent: true, opacity: 0.45, depthWrite: false }),
    mouth: std('#8a3b2e', 0.6),
    shirt: std('#2a8fa6', 0.85), star: std('#ffcf45', 0.7), bow: std('#ee5c9a', 0.72),
    jeans: std('#41587f', 0.85), skirt: std('#8a63d2', 0.82), shoe: std('#f7f1e6', 0.7), sole: std('#e8573f', 0.7),
    pack: std('#e8573f', 0.75), trim: std('#f2b632', 0.75), strap: std('#b9402c', 0.8),
    floor: std('#a8dcb6', 0.95), rim: std('#c4531d', 0.7),
    villageGround: std('#8fcb83', 0.98), house: std('#fff1c9', 0.82), roofCoral: std('#e8573f', 0.82),
    roofBlue: std('#4c86cf', 0.82), roofYellow: std('#f2b632', 0.82), roofPurple: std('#9671c8', 0.82), door: std('#8a5a3b', 0.9),
    window: std('#a9e0f3', 0.35), treeBark: std('#8a5a3b', 0.92), leafGreen: std('#5eaa62', 0.94),
    leafLight: std('#82c96d', 0.94), flower: std('#ffcf45', 0.8), path: std('#f4cd8b', 0.98),
    signBoard: std('#ffffff', 0.78), signPost: std('#3965a2', 0.78), signTrim: std('#f2b632', 0.65), hillBlue: std('#72b9cf', 0.98), hillGreen: std('#8bcb91', 0.98),
    mountain: std('#75b9de', 0.98), mountainLilac: std('#a99be0', 0.98), snow: std('#ffffff', 0.96), steppingStone: std('#f5d8a8', 0.96),
    berry: std('#ed6b62', 0.85),
    water: std('#55c5e2', 0.28), waterShine: std('#c9f5ff', 0.32),
    cloud: std('#e3f4ff', 0.98), skyBlue: std('#8ed4f3', 0.82), sun: new THREE.MeshBasicMaterial({ color: 0xffc83d }),
    blob: new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.22, color: 0x000000, depthWrite: false })
  };

  var SPH = new THREE.SphereGeometry(1, 40, 28);
  function mk(geo, mat, x, y, z, sx, sy, sz) {
    var o = new THREE.Mesh(geo, mat);
    o.position.set(x || 0, y || 0, z || 0);
    if (sx) { o.scale.set(sx, sy, sz); }
    o.castShadow = true; o.receiveShadow = true;
    return o;
  }

  var child = new THREE.Group();
  scene.add(child);

  /* ---------- body ---------- */
  var boyPants = new THREE.Group();
  child.add(boyPants);
  boyPants.add(mk(SPH, M.jeans, 0, 0.82, 0, 0.37, 0.2, 0.3));
  var boyTorso = mk(SPH, M.shirt, 0, 1.2, 0, 0.42, 0.5, 0.34);
  child.add(boyTorso);
  child.add(mk(new THREE.CylinderGeometry(0.12, 0.14, 0.3, 24), M.skin, 0, 1.72, 0));
  var boyCollar = mk(new THREE.TorusGeometry(0.14, 0.035, 10, 28), M.shirt, 0, 1.66, 0);
  boyCollar.rotation.x = Math.PI / 2;
  child.add(boyCollar);

  /* A gently tapered top gives the girl explorer a distinct, natural child silhouette. */
  var girlTopProfile = [
    new THREE.Vector2(0, -0.48), new THREE.Vector2(0.29, -0.48),
    new THREE.Vector2(0.31, -0.34), new THREE.Vector2(0.27, -0.12),
    new THREE.Vector2(0.3, 0.12), new THREE.Vector2(0.35, 0.34),
    new THREE.Vector2(0.3, 0.48), new THREE.Vector2(0, 0.48)
  ];
  var girlTorso = new THREE.Mesh(new THREE.LatheGeometry(girlTopProfile, 32), M.shirt);
  girlTorso.position.y = 1.2;
  girlTorso.castShadow = true;
  girlTorso.receiveShadow = true;
  child.add(girlTorso);
  var girlCollar = mk(new THREE.TorusGeometry(0.13, 0.03, 10, 28), M.shirt, 0, 1.66, 0);
  girlCollar.rotation.x = Math.PI / 2;
  child.add(girlCollar);
  girlTorso.visible = false;
  girlCollar.visible = false;
  var star = new THREE.Shape(), k, r, a;
  for (k = 0; k < 10; k++) {
    r = k % 2 === 0 ? 0.1 : 0.045; a = Math.PI / 5 * k + Math.PI / 2;
    if (k === 0) { star.moveTo(Math.cos(a) * r, Math.sin(a) * r); } else { star.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  }
  var starMesh = new THREE.Mesh(new THREE.ShapeGeometry(star), M.star);
  starMesh.position.set(0, 1.32, 0.333);
  child.add(starMesh);

  [-1, 1].forEach(function (s) {
    boyPants.add(mk(new THREE.CylinderGeometry(0.15, 0.14, 0.62, 24), M.jeans, 0.19 * s, 0.46, 0));
    child.add(mk(SPH, M.shoe, 0.19 * s, 0.11, 0.07, 0.17, 0.1, 0.26));
    child.add(mk(SPH, M.sole, 0.19 * s, 0.04, 0.07, 0.18, 0.04, 0.275));
  });

  var girlOutfit = new THREE.Group();
  child.add(girlOutfit);
  [-1, 1].forEach(function (s) {
    girlOutfit.add(mk(new THREE.CylinderGeometry(0.12, 0.11, 0.57, 24), M.skin, 0.19 * s, 0.45, 0));

        var left = preferredSide === 'right' ? ax + 30 : preferredSide === 'left' ? ax - cardWidth - 30 : ax - cardWidth / 2;
        var top = preferredSide === 'down' ? ay + 30 : preferredSide === 'up' ? ay - cardHeight - 30 : ay - cardHeight / 2;
        left = Math.max(14, Math.min(cw - cardWidth - 14, left));
        top = Math.max(14, Math.min(ch - cardHeight - 14, top));
        partPopup.style.left = left + 'px';
        partPopup.style.top = top + 'px';
        var edgeX = preferredSide === 'right' ? left : preferredSide === 'left' ? left + cardWidth : Math.max(left + 16, Math.min(left + cardWidth - 16, ax));
        var edgeY = preferredSide === 'down' ? top : preferredSide === 'up' ? top + cardHeight : Math.max(top + 16, Math.min(top + cardHeight - 16, ay));
        var bendX = (ax + edgeX) * 0.5;
        calloutLine.setAttribute('viewBox', '0 0 ' + cw + ' ' + ch);
        calloutPath.setAttribute('d', 'M ' + ax + ' ' + ay + ' Q ' + bendX + ' ' + ay + ' ' + edgeX + ' ' + edgeY);
        calloutDot.setAttribute('cx', ax);
        calloutDot.setAttribute('cy', ay);
      }
    }
    var pointerTarget = bodyPartTargets.find(function (target) { return target.userData.bodyPartId === pointerTargetId; });
    if (pointerTarget) {
      pointerTarget.getWorldPosition(pointerWorld).project(camera);
      var pointerVisible = pointerWorld.z >= -1 && pointerWorld.z <= 1 && Math.abs(pointerWorld.x) <= 1 && Math.abs(pointerWorld.y) <= 1;
      touchPointer.style.display = pointerVisible ? 'block' : 'none';
      if (pointerVisible) {
        touchPointer.style.left = ((pointerWorld.x + 1) * 0.5 * stage.clientWidth) + 'px';
        touchPointer.style.top = ((1 - pointerWorld.y) * 0.5 * stage.clientHeight) + 'px';
      }
    }
    renderer.render(scene, camera);
  }
  tick();
})();
</script>
